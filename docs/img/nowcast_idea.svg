<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f3f4f6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9ca3af" stroke-width="2"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="820" height="380" rx="14" fill="#ffffff"/>

  <!-- LEFT: space -->
  <text x="205" y="32" fill="#1f2937" font-size="14" font-weight="bold" text-anchor="middle">Space: what happened nearby?</text>
  <rect x="30" y="48" width="350" height="290" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
  <g stroke="#e5e7eb">
    <line x1="30" y1="106" x2="380" y2="106"/><line x1="30" y1="164" x2="380" y2="164"/><line x1="30" y1="222" x2="380" y2="222"/><line x1="30" y1="280" x2="380" y2="280"/>
    <line x1="100" y1="48" x2="100" y2="338"/><line x1="170" y1="48" x2="170" y2="338"/><line x1="240" y1="48" x2="240" y2="338"/><line x1="310" y1="48" x2="310" y2="338"/>
  </g>
  <g fill="none" stroke="#0072B2" stroke-dasharray="4 4">
    <circle cx="205" cy="193" r="42"/><circle cx="205" cy="193" r="84" stroke-opacity="0.7"/><circle cx="205" cy="193" r="128" stroke-opacity="0.45"/>
  </g>
  <g font-size="11" fill="#0072B2" font-weight="bold">
    <text x="232" y="160">r₁</text><text x="266" y="122">r₂</text><text x="300" y="86">r₃</text>
  </g>
  <!-- past RO profiles: orange = Es, blue = no Es; opacity = recency -->
  <g stroke="#ffffff" stroke-width="1">
    <circle cx="186" cy="176" r="7" fill="#D55E00"/>
    <circle cx="228" cy="208" r="7" fill="#D55E00" fill-opacity="0.85"/>
    <circle cx="170" cy="222" r="7" fill="#D55E00" fill-opacity="0.6"/>
    <circle cx="150" cy="196" r="7" fill="#0072B2" fill-opacity="0.85"/>
    <circle cx="140" cy="150" r="7" fill="#D55E00" fill-opacity="0.45"/>
    <circle cx="262" cy="246" r="7" fill="#D55E00" fill-opacity="0.75"/>
    <circle cx="128" cy="250" r="7" fill="#0072B2" fill-opacity="0.5"/>
    <circle cx="290" cy="196" r="7" fill="#0072B2" fill-opacity="0.9"/>
    <circle cx="110" cy="110" r="7" fill="#0072B2" fill-opacity="0.35"/>
    <circle cx="306" cy="292" r="7" fill="#D55E00" fill-opacity="0.35"/>
    <circle cx="96" cy="292" r="7" fill="#0072B2" fill-opacity="0.6"/>
    <circle cx="322" cy="112" r="7" fill="#0072B2" fill-opacity="0.45"/>
    <circle cx="60" cy="200" r="7" fill="#D55E00" fill-opacity="0.3"/>
    <circle cx="350" cy="230" r="7" fill="#0072B2" fill-opacity="0.3"/>
    <circle cx="205" cy="80" r="7" fill="#0072B2" fill-opacity="0.55"/>
  </g>
  <g stroke="#111827" stroke-width="2.6"><line x1="196" y1="193" x2="214" y2="193"/><line x1="205" y1="184" x2="205" y2="202"/></g>
  <text x="205" y="333" fill="#111827" font-size="11.5" text-anchor="middle">+ target location and time</text>
  <!-- legend -->
  <g font-size="10.5" fill="#374151">
    <circle cx="44" cy="358" r="6" fill="#D55E00"/><text x="56" y="362">Es detected</text>
    <circle cx="140" cy="358" r="6" fill="#0072B2"/><text x="152" y="362">no Es</text>
    <text x="212" y="362">faded = older observation</text>
  </g>

  <!-- RIGHT: time -->
  <text x="612" y="32" fill="#1f2937" font-size="14" font-weight="bold" text-anchor="middle">Time: how recently?</text>
  <line x1="430" y1="200" x2="796" y2="200" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="792" y="222" fill="#374151" font-size="10.5" text-anchor="end">time</text>
  <rect x="664" y="168" width="52" height="32" fill="url(#hatch)"/>
  <text x="690" y="160" fill="#4b5563" font-size="10.5" text-anchor="middle">latency</text>
  <text x="690" y="148" fill="#4b5563" font-size="10.5" text-anchor="middle">1 h data</text>
  <line x1="716" y1="120" x2="716" y2="236" stroke="#111827" stroke-width="2"/>
  <text x="716" y="252" fill="#111827" font-size="12" font-weight="bold" text-anchor="middle">now</text>
  <g stroke="#ffffff">
    <circle cx="452" cy="200" r="5.5" fill="#0072B2" fill-opacity="0.35"/><circle cx="486" cy="200" r="5.5" fill="#D55E00" fill-opacity="0.4"/>
    <circle cx="530" cy="200" r="5.5" fill="#0072B2" fill-opacity="0.55"/><circle cx="566" cy="200" r="5.5" fill="#D55E00" fill-opacity="0.6"/>
    <circle cx="600" cy="200" r="5.5" fill="#D55E00" fill-opacity="0.75"/><circle cx="628" cy="200" r="5.5" fill="#0072B2" fill-opacity="0.85"/>
    <circle cx="652" cy="200" r="5.5" fill="#D55E00"/>
  </g>
  <!-- windows -->
  <g stroke="#0072B2" stroke-width="1.6" fill="none">
    <path d="M620,186 v-6 h44 v6"/><path d="M560,170 v-6 h104 v6" stroke-opacity="0.75"/><path d="M448,154 v-6 h216 v6" stroke-opacity="0.5"/>
  </g>
  <g fill="#0072B2" font-size="11" font-weight="bold" text-anchor="middle">
    <text x="642" y="175">Δt₁</text><text x="606" y="159">Δt₂</text><text x="552" y="142">Δt₃</text>
  </g>
  <!-- features to model -->
  <rect x="432" y="272" width="250" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="557" y="292" fill="#1e3a8a" font-size="11" text-anchor="middle">Es fraction in each radius × window</text>
  <text x="557" y="308" fill="#1e3a8a" font-size="11" text-anchor="middle">+ location, local time, season</text>
  <text x="557" y="324" fill="#1e3a8a" font-size="11" text-anchor="middle">+ solar wind, geomagnetic indices</text>
  <path d="M682,304 L720,304" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="724" y="276" width="78" height="56" rx="8" fill="#0072B2"/>
  <text x="763" y="298" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">P(Es)</text>
  <text x="763" y="316" fill="#dbeafe" font-size="10" text-anchor="middle">calibrated</text>
  <text x="612" y="360" fill="#6b7280" font-size="10.5" text-anchor="middle">gradient-boosted trees, seed ensemble, isotonic calibration</text>
</svg>
