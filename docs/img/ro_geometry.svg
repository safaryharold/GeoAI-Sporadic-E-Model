<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="left"><rect x="10" y="10" width="500" height="340" rx="10"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1d3a"/><stop offset="1" stop-color="#1e3a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E69F00" stop-opacity="0.55"/><stop offset="1" stop-color="#E69F00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="820" height="360" rx="14" fill="#ffffff"/>
  <!-- left panel: geometry -->
  <g clip-path="url(#left)">
    <rect x="10" y="10" width="500" height="340" rx="10" fill="url(#sky)"/>
    <g fill="#ffffff" opacity="0.7">
      <circle cx="120" cy="30" r="1"/><circle cx="210" cy="55" r="1.2"/><circle cx="330" cy="28" r="1"/>
      <circle cx="400" cy="60" r="0.9"/><circle cx="460" cy="40" r="1.1"/><circle cx="170" cy="120" r="0.8"/>
      <circle cx="300" cy="110" r="1"/><circle cx="440" cy="140" r="0.8"/><circle cx="60" cy="160" r="1"/>
    </g>
    <!-- E region shell -->
    <circle cx="260" cy="1100" r="885" fill="none" stroke="#7fb3e6" stroke-opacity="0.35" stroke-width="22"/>
    <!-- Earth -->
    <circle cx="260" cy="1100" r="850" fill="#2f6f4f"/>
    <circle cx="260" cy="1100" r="850" fill="none" stroke="#8fd3b0" stroke-width="2"/>
    <!-- Es patch -->
    <ellipse cx="260" cy="215" rx="90" ry="20" fill="url(#glow)"/>
    <path d="M200,217 A885,885 0 0,1 320,217" fill="none" stroke="#E69F00" stroke-width="7" stroke-linecap="round"/>
    <!-- ray -->
    <path d="M40,70 Q260,348 480,90" fill="none" stroke="#56B4E9" stroke-width="2.4" stroke-dasharray="7 5"/>
    <circle cx="260" cy="214" r="4.5" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
    <!-- satellites -->
    <g transform="translate(40,70)">
      <rect x="-7" y="-7" width="14" height="14" fill="#e5e7eb"/><rect x="-27" y="-4" width="17" height="8" fill="#56B4E9"/><rect x="10" y="-4" width="17" height="8" fill="#56B4E9"/>
    </g>
    <g transform="translate(480,90)">
      <rect x="-6" y="-6" width="12" height="12" fill="#e5e7eb"/><rect x="-22" y="-3" width="14" height="6" fill="#56B4E9"/><rect x="8" y="-3" width="14" height="6" fill="#56B4E9"/>
    </g>
    <text x="74" y="56" fill="#ffffff" font-size="13" font-weight="bold">GNSS satellite</text>
    <text x="74" y="72" fill="#c7d2fe" font-size="11">GPS, GLONASS, …  (~20 000 km)</text>
    <text x="456" y="56" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="end">LEO receiver</text>
    <text x="456" y="72" fill="#c7d2fe" font-size="11" text-anchor="end">COSMIC, Spire, …  (~500 km)</text>
    <text x="260" y="186" fill="#ffd27a" font-size="12.5" font-weight="bold" text-anchor="middle">Sporadic-E layer</text>
    <text x="260" y="246" fill="#ffffff" font-size="11" text-anchor="middle">tangent point, ~90–130 km</text>
    <text x="260" y="300" fill="#d1fae5" font-size="12" text-anchor="middle">Earth</text>
    <text x="24" y="338" fill="#93c5fd" font-size="10.5">signal path grazes the atmosphere as the LEO satellite sets behind the limb</text>
  </g>
  <!-- right panel: SNR profile -->
  <text x="672" y="34" fill="#1f2937" font-size="13" font-weight="bold" text-anchor="middle">What the receiver records</text>
  <rect x="560" y="181" width="232" height="58" fill="#E69F00" opacity="0.16"/>
  <line x1="560" y1="50" x2="560" y2="312" stroke="#6b7280"/>
  <line x1="560" y1="312" x2="792" y2="312" stroke="#6b7280"/>
  <g font-size="10" fill="#4b5563" text-anchor="end">
    <text x="554" y="64">150</text><text x="554" y="135">130</text><text x="554" y="206">110</text><text x="554" y="278">90</text>
  </g>
  <text x="536" y="190" fill="#374151" font-size="10.5" transform="rotate(-90 536 190)" text-anchor="middle">tangent altitude (km)</text>
  <text x="676" y="330" fill="#374151" font-size="10.5" text-anchor="middle">signal-to-noise ratio (amplitude)</text>
  <polyline fill="none" stroke="#0072B2" stroke-width="1.8" stroke-linejoin="round"
    points="742,60 743,72 741,84 742,96 744,108 742,120 741,132 743,144 742,156 741,168 742,178 735,184 754,188 718,192 766,196 704,200 774,204 696,208 770,212 708,216 762,220 716,224 752,228 728,232 746,236 738,240 740,248 737,258 739,268 735,280 736,292 733,304"/>
  <text x="566" y="176" fill="#b45309" font-size="11" font-weight="bold">Es: sharp scintillation</text>
  <text x="566" y="254" fill="#b45309" font-size="10.5">S4 &gt; 0.2  →  flagged</text>
  <text x="600" y="104" fill="#6b7280" font-size="10.5">quiet above the layer</text>
</svg>
