<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="h2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="#e5e7eb"/><line x1="0" y1="0" x2="0" y2="5" stroke="#9ca3af" stroke-width="1.6"/>
    </pattern>
  </defs>
  <rect width="820" height="300" rx="14" fill="#ffffff"/>

  <!-- A: spatial -->
  <text x="30" y="34" fill="#1f2937" font-size="14" font-weight="bold">A · Spatial block cross-validation</text>
  <text x="30" y="52" fill="#6b7280" font-size="11">Can the model fill in a region it has never seen?</text>
  <g stroke="#ffffff" stroke-width="2">
    <g fill="#009E73" fill-opacity="0.75">
      <rect x="40" y="70" width="44" height="44"/><rect x="84" y="70" width="44" height="44"/><rect x="128" y="70" width="44" height="44"/><rect x="172" y="70" width="44" height="44"/><rect x="216" y="70" width="44" height="44"/><rect x="260" y="70" width="44" height="44"/>
      <rect x="40" y="114" width="44" height="44"/><rect x="84" y="114" width="44" height="44"/><rect x="128" y="114" width="44" height="44"/><rect x="172" y="114" width="44" height="44"/><rect x="216" y="114" width="44" height="44"/><rect x="260" y="114" width="44" height="44"/>
      <rect x="40" y="158" width="44" height="44"/><rect x="84" y="158" width="44" height="44"/><rect x="128" y="158" width="44" height="44"/><rect x="172" y="158" width="44" height="44"/><rect x="216" y="158" width="44" height="44"/><rect x="260" y="158" width="44" height="44"/>
      <rect x="40" y="202" width="44" height="44"/><rect x="84" y="202" width="44" height="44"/><rect x="128" y="202" width="44" height="44"/><rect x="172" y="202" width="44" height="44"/><rect x="216" y="202" width="44" height="44"/><rect x="260" y="202" width="44" height="44"/>
    </g>
  </g>
  <!-- buffer band + test tile -->
  <rect x="116" y="102" width="112" height="112" fill="url(#h2)"/>
  <rect x="128" y="114" width="88" height="88" fill="#0072B2"/>
  <text x="172" y="162" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">TEST</text>
  <g font-size="11" fill="#374151">
    <rect x="320" y="92" width="12" height="12" fill="#009E73" fill-opacity="0.75"/><text x="338" y="102">train tiles (10° × 10°)</text>
    <rect x="320" y="118" width="12" height="12" fill="#0072B2"/><text x="338" y="128">held-out fold</text>
    <rect x="320" y="144" width="12" height="12" fill="url(#h2)"/><text x="338" y="154">300 km buffer, discarded</text>
    <text x="320" y="186" fill="#6b7280">so no training profile sits</text>
    <text x="320" y="200" fill="#6b7280">next to a test profile</text>
  </g>
  <text x="30" y="276" fill="#4b5563" font-size="11">Gives an optimistic upper bound: the model still sees every year.</text>

  <line x1="490" y1="24" x2="490" y2="276" stroke="#e5e7eb"/>

  <!-- B: forward in time -->
  <text x="512" y="34" fill="#1f2937" font-size="14" font-weight="bold">B · Forward in time</text>
  <text x="512" y="52" fill="#6b7280" font-size="11">Can it forecast years it has never seen?</text>
  <rect x="512" y="100" width="180" height="40" rx="4" fill="#009E73" fill-opacity="0.75"/>
  <rect x="694" y="100" width="34" height="40" rx="4" fill="#E69F00"/>
  <rect x="730" y="100" width="66" height="40" rx="4" fill="#0072B2"/>
  <text x="602" y="125" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">train  ≤ 2021</text>
  <text x="711" y="125" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">2022</text>
  <text x="763" y="125" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">2023–24</text>
  <text x="512" y="158" fill="#047857" font-size="10.5">final model retrained</text>
  <text x="512" y="172" fill="#047857" font-size="10.5">through 2022</text>
  <g font-size="11" fill="#374151">
    <line x1="711" y1="142" x2="711" y2="168" stroke="#E69F00"/><text x="704" y="182" text-anchor="end">development year: every design</text>
    <text x="704" y="196" text-anchor="end">choice made here, threshold fixed first</text>
    <line x1="763" y1="142" x2="763" y2="214" stroke="#0072B2"/><text x="796" y="230" text-anchor="end">test years: opened once,</text>
    <text x="796" y="244" text-anchor="end">after everything was frozen</text>
  </g>
  <text x="512" y="276" fill="#4b5563" font-size="11">The operational question: no peeking at the future.</text>
</svg>
